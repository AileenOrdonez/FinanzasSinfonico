<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tu aporte | Finanzas Sinfónico</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="aporte">

        <!-- Logo -->
        <img src="images/Logo.png" alt="Finanzas Sinfónico" class="logo aporte-logo">


        <!-- Mensaje -->
        <section class="aporte-texto">

            <h1>
                Cada músico tiene<br>
                algo único que aportar
            </h1>

            <p>
                ¿Qué aportarás tú a nuestra orquesta?
            </p>

        </section>


        <!-- Campo de palabra -->
        <form class="aporte-form" onsubmit="return false;">

            <input type="text" id="aporteInput" class="aporte-input" placeholder="Ingresa tu aporte" autocomplete="off"
                spellcheck="false" autofocus>

        </form>

    </main>

    <script src="script.js"></script>

</body>

</html>
