<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El Trombón - Finanzas Sinfónico</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="tocar">

        <!-- TÍTULO E INSTRUCCIONES -->

        <header class="tocar-header">


            <h1>El Trombón</h1>

            <p>
                Usa el teclado para tocar - Sigue a tu director - Escucha a tus compañeros
            </p>

        </header>
        


        <!-- PARTITURA -->

        <section class="partitura-container">

            <img
                src="images/PartituraTrombon.png"
                alt="Partitura del trombón"
                class="partitura-img"
            >

        </section>

        <br>


        <!-- ÁREA DEL INSTRUMENTO -->

        <section class="instrumento-area">

            <!-- TECLAS -->

            <div class="teclas-tocar">

                <div class="tecla" data-key="H" data-audio="./audio/TrombonH.mp3">
                    H
                </div>

                <div class="tecla" data-key="J" data-audio="./audio/TrombonJ.mp3">
                    J
                </div>

                <div class="tecla" data-key="K" data-audio="./audio/TrombonK.mp3">
                    K
                </div>

                <div class="tecla" data-key="L" data-audio="./audio/TrombonL.mp3">
                    L
                </div>

            </div>


            <!-- ILUSTRACIÓN -->

            <img
                src="images/FondoTrombon.png"
                alt="Trombon"
                class="fondo-instrumento fondo-trombon"
            >

        </section>

    </main>


    <script src="tocar.js"></script>

</body>

</html>
