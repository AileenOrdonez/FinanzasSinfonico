<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La Trompeta - Finanzas Sinfónico</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="tocar">

        <!-- TÍTULO E INSTRUCCIONES -->

        <header class="tocar-header">


            <h1>La Trompeta</h1>

            <p>
                Usa el teclado para tocar - Sigue a tu director - Escucha a tus compañeros
            </p>

        </header>


        <!-- PARTITURA -->

        <section class="partitura-container">

            <img src="images/PartituraTrompeta.png" alt="Partitura del trompeta" class="partitura-img">

        </section>

        <br>


        <!-- ÁREA DEL INSTRUMENTO -->

        <section class="instrumento-area">

            <!-- TECLAS -->

            <div class="teclas-tocar">

                <div class="tecla" data-key="K" data-audio="./audio/TrompetaK.mp3">

                    K
                </div>

                <div class="tecla" data-key="J" data-audio="./audio/TrompetaJ.mp3">
                    J
                </div>

                <div class="tecla" data-key="Q" data-audio="./audio/TrompetaQ.mp3">
                    Q
                </div>

                <div class="tecla" data-key="W" data-audio="./audio/TrompetaW.mp3">
                    W
                </div>

                <div class="tecla" data-key="E" data-audio="./audio/TrompetaE.mp3">
                    E
                </div>

                <div class="tecla" data-key="R" data-audio="./audio/TrompetaR.mp3">
                    R
                </div>

                <div class="tecla" data-key="I" data-audio="./audio/TrompetaI.mp3">
                    I
                </div>

                <div class="tecla" data-key="U" data-audio="./audio/TrompetaU.mp3">
                    U
                </div>


            </div>


            <!-- ILUSTRACIÓN -->

            <img src="images/FondoTrompeta.png" alt="Trompeta" class="fondo-instrumento fondo-trompeta">

        </section>

    </main>


    <script src="tocar.js"></script>

</body>

</html>
